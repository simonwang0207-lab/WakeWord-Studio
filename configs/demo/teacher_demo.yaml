providers:
  kokoro:
    display_name: Kokoro
    kind: tts
    dependency: kokoro
    python: .envs/kokoro/Scripts/python.exe
    worker: phase1/scripts/generate_dataset.py
    description: 多说话人中文本地 TTS
    capabilities:
      multi_speaker: true
      gender_metadata: true
      age_metadata: false
      local_audio_import: false
  local_folder:
    display_name: 本地语音文件夹
    kind: local_folder
    worker: phase7/scripts/import_local_dataset.py
    description: 导入用户已有的 16 kHz WAV；不会虚构年龄标签
    capabilities:
      multi_speaker: true
      gender_metadata: true
      age_metadata: true
      local_audio_import: true
detection:
  consecutive_wake_frames: 2
  peak_background_ratio: 1.20
  background_alpha: 0.97
  cooldown_seconds: 2.0
  arbitration_margin: 0.05
  pre_silence_frames: 3
  post_silence_frames: 2
