schema: wakeword-studio.repcnn-performance-training/v2.1-robust-finetune
model_name: qingxiaojia_repcnn_performance_v2_1_robust_finetune
target_phrases: ["你好，青小甲"]

dataset_manifest: F:\ZJU_intership\task\4\WakeWord-Studio\datasets\projects\qingxiaojia_v3_fasttrack\DatasetManifest.json
dataset_manifest_sha256: 85c263d2a1cee7747230eba48fc1f6c7826fa7d2179b666399477ecacc67963f
source_dataset_manifest: F:\ZJU_intership\task\4\WakeWord-Studio\datasets\projects\qingxiaojia_v2\DatasetManifest.json
source_dataset_manifest_sha256: 50e3857e9941d910b640039dd70e73c39e331cc368816c378849ca9774f1973c
source_feature_cache: F:\ZJU_intership\task\4\WakeWord-Studio\runs\qingxiaojia\repcnn_performance_v1\formal\user_run_01\feature_cache_train_validation_only
output_dir: F:\ZJU_intership\task\4\WakeWord-Studio\runs\qingxiaojia\repcnn_performance_v2_1_robust_finetune
seed: 20260831
weight_decay: 0.01

frozen_data_contract:
  allowed_splits: [train, validation]
  held_out_test_loaded: false
  v2_test_for_tuning: false
  v1_external_for_tuning: false
  live_diagnostic_wavs_for_tuning: false
  base_model_policy: require_explicit_completed_b2_weights

augmentation:
  clip_duration: 2.0
  batch_size: 32
  window_size_ms: 30
  window_step_ms: 20
  num_channels: 40
  temporal_shift:
    enabled: true
    maximum_frames: 3
    probability: 0.5
    padding: zero
    circular_wrap: false
  mild_spec_augment:
    enabled: true
    probability: 0.5
    maximum_time_mask_frames: 3
    maximum_frequency_mask_bins: 2
  microphone_eq:
    enabled: false
    maximum_edge_gain_db: 0.0
    reason: controlled_hook_only_requires_validation_ablation_before_enablement

frontend:
  name: TensorFlow Lite Micro microfrontend
  implementation: livekit_embedded_wakeword.MicroFrontend
  sample_rate_hz: 16000
  window_size_ms: 30
  window_step_ms: 20
  feature_bins: 40
  input_shape: [99, 40]
  normalization: uint16_times_0.0390625_to_float32
  pcan: true
  lower_band_limit_hz: 125.0
  upper_band_limit_hz: 7500.0

model:
  model_type: repcnn
  model_size: xxlarge
  filters: 64
  n_blocks: 11
  temporal_dilation_cycle: [1, 2, 4]
  dropout: 0.1
  sigmoid_head_initializer: zeros_for_stable_unsaturated_start
  deployment_fusion: single_depthwise_3x3_plus_pointwise_1x1_per_block
  output: sigmoid_probability

objective:
  type: clip_level_focal_binary_crossentropy
  gamma: 2.0
  mixup_alpha: 0.1
  negative_weight: 5.0

sampling:
  policy: deterministic_hierarchical_least_exposed
  batch_n_per_class:
    positive: 16
    negative: 4
    hard_negative: 8
    ambient: 4
  required_speech_sources: [kokoro, voxcpm15]
  hard_negative_phrases:
    - "你好，小甲"
    - "你好，青甲"
    - "青小甲"
    - "你好吗，青小甲"
    - "你好，金小甲"
    - "你好，星小甲"
    - "你好，青小杰"
    - "你好，青小佳"
    - "你好，请小甲"

fine_tune:
  planned_steps: 750
  allowed_step_range: [500, 1000]
  learning_rate: 0.00001
  validation_interval: 250
  checkpoint_max_to_keep: 3
  maximum_overall_fpr: 0.10
  estimated_cpu_minutes: [30, 45]

quantization:
  format: full_int8_tflite
  representative_splits: [train, validation]
  input_type: int8
  output_type: int8
  expected_input_shape: [1, 99, 40]
  expected_output_shape: [1, 1]
